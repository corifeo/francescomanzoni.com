<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="preload" href="/assets/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
</head>
<body>
  <header class="site">
    {% unless page.url == "/" %}<a class="home" href="/">{{ site.title }}</a>{% endunless %}
    <nav aria-label="Main">
      {% if site.posts.size > 0 %}<a href="/writing/">Writing</a>{% endif %}
      <a href="https://github.com/corifeo" rel="me">GitHub</a>
      <a href="https://www.linkedin.com/in/CHANGE-ME/" rel="me">LinkedIn</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site">
    <p>Static site with no cookies, tracking or JavaScript. Found a problem? See <a href="/.well-known/security.txt">security.txt</a>.</p>
  </footer>
</body>
</html>
