<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="preload" href="/assets/fonts/familjen-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="home" href="/">francescomanzoni.com</a>
      <nav aria-label="Main">
        {% if site.posts.size > 0 %}<a class="ul{% if page.nav == 'writing' %} on{% endif %}" href="/writing/">Writing</a>{% endif %}
        <a class="ul" href="https://github.com/corifeo" rel="me">GitHub</a>
        <a class="ul" href="https://www.linkedin.com/in/francescomanzoni/" rel="me">LinkedIn</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site">
      <p>Static site with no cookies, tracking or JavaScript. Found a problem? See <a href="/.well-known/security.txt">security.txt</a>.</p>
    </footer>
  </div>
</body>
</html>
