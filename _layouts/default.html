<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
</head>
<body>
  <header class="site">
    <a class="name" href="/">{{ site.title }}</a>
    <nav>
      {% if site.posts.size > 0 %}<a href="/writing/">Writing</a>{% endif %}
      <a href="https://github.com/corifeo" rel="me">GitHub</a>
      <a href="https://www.linkedin.com/in/CHANGE-ME/" rel="me">LinkedIn</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site">
    <p>Static site. No cookies, no tracking, no JavaScript. <a href="/.well-known/security.txt">security.txt</a></p>
  </footer>
</body>
</html>
